name: Update OData dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-odata-dependencies
  cancel-in-progress: false

jobs:
  update:
    name: Update ${{ matrix.target-branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target-branch:
          - main
          - dev-10.x

    steps:
      - name: Check out automation
        uses: actions/checkout@v4
        with:
          path: automation

      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target-branch }}
          fetch-depth: 0
          path: target

      - name: Determine .NET SDK
        id: framework
        shell: pwsh
        run: |
          $project = Get-Content target/src/Microsoft.AspNetCore.OData/Microsoft.AspNetCore.OData.csproj -Raw
          $frameworkMatches = [regex]::Matches($project, "<TargetFramework(?:s)?>(?<TargetFrameworkValues>[^<]+)")
          $targetFrameworks = @(
              $frameworkMatches |
                  ForEach-Object { $_.Groups['TargetFrameworkValues'].Value -split ';' } |
                  ForEach-Object { $_.Trim() } |
                  Where-Object { $_ } |
                  Select-Object -Unique
          )

          if ($targetFrameworks.Count -eq 0) {
              throw "Could not find TargetFramework or TargetFrameworks in the project."
          }

          $dotnetVersions = @(
              $targetFrameworks | ForEach-Object {
                      if ($_ -match '^net(?<Major>\d+)\.') { "$($Matches['Major']).0.x" }
                  } |
                  Sort-Object -Unique
          )

          if ($dotnetVersions.Count -eq 0) {
              throw "Could not determine a .NET SDK version from: $($targetFrameworks -join ', ')."
          }

          "target-frameworks=$($targetFrameworks -join ', ')" >> $env:GITHUB_OUTPUT
          "dotnet-versions<<EOF" >> $env:GITHUB_OUTPUT
          $dotnetVersions >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.framework.outputs['dotnet-versions'] }}

      - name: Find stable compatible dependency versions
        id: update
        shell: pwsh
        run: |
          ./automation/.github/scripts/Update-ODataDependencies.ps1 -PackagesFile target/Directory.Packages.props

      - name: Verify dependency compatibility
        if: steps.update.outputs.changed == 'true'
        run: dotnet restore target/src/Microsoft.AspNetCore.OData/Microsoft.AspNetCore.OData.csproj

      - name: Create or update pull request
        if: steps.update.outputs.changed == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ matrix.target-branch }}
          TARGET_FRAMEWORKS: ${{ steps.framework.outputs['target-frameworks'] }}
          PREVIOUS_ODATA_LIB_VERSION: ${{ steps.update.outputs['previous-odata-lib-version'] }}
          ODATA_LIB_VERSION: ${{ steps.update.outputs['odata-lib-version'] }}
          PREVIOUS_MODEL_BUILDER_VERSION: ${{ steps.update.outputs['previous-model-builder-version'] }}
          MODEL_BUILDER_VERSION: ${{ steps.update.outputs['model-builder-version'] }}
        shell: bash
        run: |
          set -euo pipefail

          branch_suffix="${TARGET_BRANCH//[^a-zA-Z0-9-]/-}"
          update_branch="automation/update-odata-dependencies-${branch_suffix}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${update_branch}"
          git add Directory.Packages.props
          git commit -m "chore: update OData dependencies for ${TARGET_BRANCH}"

          git fetch origin "${update_branch}:refs/remotes/origin/${update_branch}" || true
          git push --force-with-lease origin "HEAD:refs/heads/${update_branch}"

          title="Update ODataLib to ${ODATA_LIB_VERSION} and ModelBuilder to ${MODEL_BUILDER_VERSION} on ${TARGET_BRANCH}"
          body_file="${RUNNER_TEMP}/odata-dependency-pr.md"
          cat > "${body_file}" <<EOF
          ## Summary

          Updates the stable OData dependencies used by \`${TARGET_FRAMEWORKS}\` on \`${TARGET_BRANCH}\`.

          | Dependency | Previous | Updated |
          | --- | --- | --- |
          | Microsoft.OData.Core, Microsoft.OData.Edm, Microsoft.Spatial | \`${PREVIOUS_ODATA_LIB_VERSION}\` | \`${ODATA_LIB_VERSION}\` |
          | Microsoft.OData.ModelBuilder | \`${PREVIOUS_MODEL_BUILDER_VERSION}\` | \`${MODEL_BUILDER_VERSION}\` |

          ## Version policy

          - Includes stable NuGet versions only; prerelease versions are excluded.
          - Keeps each dependency within the major-version range configured in \`Directory.Packages.props\`.
          - Keeps Microsoft.OData.Core, Microsoft.OData.Edm, and Microsoft.Spatial on the same version.
          - Uses one ODataLib version and one ModelBuilder version across all target frameworks.

          ## Validation

          - Restored all target frameworks in \`src/Microsoft.AspNetCore.OData/Microsoft.AspNetCore.OData.csproj\`: \`${TARGET_FRAMEWORKS}\`.

          _Created automatically by the Update OData dependencies workflow._
          EOF

          existing_pr="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" --base "${TARGET_BRANCH}" --head "${update_branch}" --state open --json number --jq '.[0].number')"

          if [[ -z "${existing_pr}" ]]; then
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" --base "${TARGET_BRANCH}" --head "${update_branch}" --title "${title}" --body-file "${body_file}"
          else
            gh pr edit "${existing_pr}" \
              --repo "${GITHUB_REPOSITORY}" --title "${title}" --body-file "${body_file}"
          fi
